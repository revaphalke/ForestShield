<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForestShield C Engine</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="app"><header class="top"><strong>ForestShield C Engine</strong><span id="stepLabel">Step 1 — Choose a forest</span></header><section class="controls"><label>Forest<select id="forest"></select></label><label>Current cell<input id="current" value="4" inputmode="numeric"></label><label>Fire cells<input id="fires" value="6" inputmode="numeric"></label><label>Spread<select id="spread"><option>0</option><option>10</option><option>20</option><option>30</option></select></label><label>Wind km/h<input id="wind" type="number" min="0" max="80" value="0"></label><button id="run" type="button">Run C route</button></section><pre id="output" aria-live="polite">Choose inputs and run the C engine.</pre></main><script type="module" src="/script.js"></script></body></html>
